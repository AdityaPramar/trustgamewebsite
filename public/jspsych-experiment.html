<script>
  const PARTICIPANT_ID = crypto.randomUUID();
  const urlParams = new URLSearchParams(window.location.search);
  const ROOM_CODE = urlParams.get("roomCode") ?? null;
  const MAIL_ID = urlParams.get("mailId") ?? localStorage.getItem("participant_mail") ?? null;
  "use strict";

  /* =========================================================
     パラメータ定数（pilotで調整しやすいよう分離）
  ========================================================= */
  const PARAMS = {
    lambda: 0.30,        // EMA減衰率
    theta: 0.25,         // 評判ストック閾値
    kappa: 0.20,         // 評判感度（全相手共通）
    mu_high: 0.343,      // 高ベース返報率
    mu_low: 0.323,       // 低ベース返報率
    sigma_eta: 0.01,     // 返報率ノイズSD（毎試行）
    sigma_delta: 0.02,   // 相手ごとオフセットSD
    r_min: 0.25,         // 返報率下限
    r_max: 0.55,         // 返報率上限
    multiplier: 3,       // 投資倍率（投資額が相手に渡るとき3倍）
    endowment: 100,      // 毎ラウンドの持ち点
    invest_step: 1,      // 投資額刻み（1円単位）
    invest_min: 0,       // 最低投資額
    invest_max: 100,     // 投資額上限
    invest_timeout: null,  // 投資画面タイムアウト(ms) ※nullで無制限
    return_display_ms: 4000, // 返報表示時間(ms)
    short_rounds_min: 4,
    short_rounds_max: 5,
    long_rounds_min: 10,
    long_rounds_max: 12,
    donation_max: 1000,
    donation_step: 10,
    match_fail_prob: 0.50, // 初回マッチング失敗確率
  };

  /* =========================================================
     ゴーストラウンド設定
     ・通常8ブロックの「3ブロック目・5ブロック目・7ブロック目」終了直後に挿入
     ・相手が先に投資し、参加者がお返し額を決める（役割反転）
     ・このラウンドのデータはFirebaseにもCSVにも保存しない
  ========================================================= */
  const GHOST_STRATEGIES = {
    G1: { min: 80, max: 100 }, // 高投資
    G2: { min: 40, max: 70 }, // 中投資
    G3: { min: 0, max: 30 }, // 低投資
  };
  // ゴーストラウンドの長さも通常ブロックと同様に短期/長期をランダム割り当て
  const GHOST_ROUND_PARAMS = {
    short_min: 3,
    short_max: 4,
    long_min: 10,
    long_max: 12,
  };

  /* =========================================================
     ユーティリティ関数
  ========================================================= */
  function sanitize(obj) {
  return Object.fromEntries(
    Object.entries(obj).map(([k, v]) => [k, v === undefined ? null : v])
  );
}

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const roundTo5 = (x) => Math.round(x / 5) * 5; // 寄付課題等で使用

  // Box-Muller法 正規分布 N(0,1)
  function randn() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
  }

  // 配列シャッフル（Fisher-Yates）
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // インストラクションページ生成
  function instructionPage(html) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<div class="mid">${html}</div>`,
      choices: ["次へ"]
    };
  }

  /* =========================================================
     アバター・ゲーム状態
  ========================================================= */
  const PLAYER_ICONS = [
    { emoji: "🐱", label: "ネコ" },
    { emoji: "🐶", label: "イヌ" },
    { emoji: "🐰", label: "ウサギ" },
  ];
  const OPPONENT_ICONS = [
    { emoji: "🦊", label: "キツネ" },
    { emoji: "🐼", label: "パンダ" },
    { emoji: "🦁", label: "ライオン" },
    { emoji: "🐸", label: "カエル" },
    { emoji: "🦉", label: "フクロウ" },
    { emoji: "🐧", label: "ペンギン" },
    { emoji: "🐻", label: "クマ" },
    { emoji: "🐯", label: "トラ" },
  ];
  const OPPONENT_NAMES = ["dai_k", "m99", "taku3", "ryo_s", "hina02", "sora", "kei_77", "yuu_t", "nao5", "ren_x"];

  const GAME = {
    playerName: "",
    playerIcon: "",
    playerTotal: 0,
    opponentTotal: 0,
  };

  // ゲームボードHTML生成
  function makeGameBoardHtml(opts) {
    const { roundNum, oppIcon, oppName, content, oppBarsHtml, playerBarsHtml, midLabel } = opts;
    const midText = midLabel || `ラウンド：${roundNum}回目`;
    return `
    <div class="game-board">
      <div class="gb-opponent">
        <div class="gb-avatar">${oppIcon}</div>
        <div><div class="gb-name">${oppName}</div><div class="gb-total">合計: <span id="opp-total">${GAME.opponentTotal}</span>円</div></div>
      </div>
      <div id="opp-bars">${oppBarsHtml || ""}</div>
      <div class="gb-mid">${midText}</div>
      <div id="my-bars">${playerBarsHtml || ""}</div>
      <div class="gb-player">
        <div class="gb-avatar">${GAME.playerIcon}</div>
        <div><div class="gb-name">${GAME.playerName}</div><div class="gb-total">合計: <span id="my-total">${GAME.playerTotal}</span>円</div></div>
      </div>
      ${content || ""}
    </div>`;
  }

  // ゲージバーHTML生成（100円=1段、超過分は段を増やす）
  function makeBar(label, yen, barUnit, cssClass, extraBarClass) {
    const barCls = extraBarClass ? `bar-fill ${cssClass} ${extraBarClass}` : `bar-fill ${cssClass}`;
    if (yen <= 0) {
      return `<div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="${barCls}" style="width:0%"></div></div>
    </div>`;
    }
    let remaining = yen;
    const rows = [];
    const numRows = Math.ceil(yen / barUnit);
    for (let i = 0; i < numRows; i++) {
      const seg = Math.min(remaining, barUnit);
      remaining -= seg;
      const pct = (seg / barUnit) * 100;
      const showLabel = i === 0 ? label : "";
      const text = (i === numRows - 1) ? `${yen}円` : "";
      rows.push(`<div class="bar-row">
      <div class="bar-label">${showLabel}</div>
      <div class="bar-track"><div class="${barCls}" style="width:${pct}%">${text}</div></div>
    </div>`);
    }
    return rows.join("");
  }

  // ISI（注視点）
  function makeFixationISI(dataObj) {
    return {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="font-size:40px;">+</div>',
      choices: "NO_KEYS",
      trial_duration: randInt(1500, 3000),
      data: Object.assign({ trial_kind: "isi" }, dataObj)
    };
  }

  /* =========================================================
     投資額配列
  ========================================================= */
  const AMOUNTS = Array.from(
    { length: (PARAMS.invest_max - PARAMS.invest_min) / PARAMS.invest_step + 1 },
    (_, i) => PARAMS.invest_min + i * PARAMS.invest_step
  ); // [0, 1, 2, ..., 100]

  /* =========================================================
     実験デザイン生成
  ========================================================= */
  function generateDesign() {
    // 4条件 = Short/Long × μ_low/μ_high, 各2相手 = 8ブロック
    const conditions = [
      { duration: "short", mu_type: "low" },
      { duration: "short", mu_type: "high" },
      { duration: "long", mu_type: "low" },
      { duration: "long", mu_type: "high" },
    ];

    const blocks = [];
    conditions.forEach(c => {
      // 各相手に小さな個人差 δ_j を付与
      const d1 = randn() * PARAMS.sigma_delta;
      const d2 = randn() * PARAMS.sigma_delta;
      blocks.push({ ...c, partnerIndex: 1, delta_j: d1 });
      blocks.push({ ...c, partnerIndex: 2, delta_j: d2 });
    });
    return shuffle(blocks);
  }

  // 相手IDラベル生成
  function generatePartnerIds(n) {
    const ids = [];
    for (let i = 0; i < n; i++) {
      ids.push(`P${String(i + 1).padStart(2, "0")}`);
    }
    return shuffle(ids);
  }

  /* =========================================================
     返報生成ロジック
  ========================================================= */
  function computeReturn(g, s_prev, mu, delta_j) {
    // 返報率: r_t = clip(μ_type + δ_j + κ·s_t + η_t, r_min, r_max)
    // ※ s_t はラグ付き（今回の投資はまだ反映されていない）
    const eta = randn() * PARAMS.sigma_eta;
    const r = clamp(mu + delta_j + PARAMS.kappa * s_prev + eta, PARAMS.r_min, PARAMS.r_max);

    // 返報額 = round(multiplier * g * r)
    const received = PARAMS.multiplier * g;
    const y = clamp(Math.round(received * r), 0, received);

    // 評判ストック更新（次試行から効く）: s_{t+1} = (1-λ)s_t + λ(g_t/100 - θ)
    const s_next = (1 - PARAMS.lambda) * s_prev + PARAMS.lambda * (g / 100 - PARAMS.theta);

    return { s_next, r, eta, y };
  }

  /* =========================================================
     ゴーストラウンド構築
     ・相手（Ghost）が先に投資額を決めて渡す
     ・参加者はいくら返すかをスライダーで決定
     ・通常ブロックと同様、短期(3〜4回)／長期(10〜12回)を
       ランダムに割り当てた複数ラウンドのミニブロックとして構成する
     ・このラウンドのtrial_kindは "ghost_*" で統一し、
       Firebaseアップロード処理・CSV書き出しの両方で除外する
     ・ゴースト役のアイコン／ハンドルネームは、通常ブロックの相手と同じ
       プール（OPPONENT_ICONS / OPPONENT_NAMES）からランダムに選ぶ
  ========================================================= */
  function buildGhostRoundTimeline(ghostType, afterBlockNum) {
    const strat = GHOST_STRATEGIES[ghostType];

    // 通常の相手と同じプールからアイコン・名前をランダムに選ぶ
    const ghostIcon = OPPONENT_ICONS[randInt(0, OPPONENT_ICONS.length - 1)].emoji;
    const ghostName = OPPONENT_NAMES[randInt(0, OPPONENT_NAMES.length - 1)];

    // 通常ブロックと同様、短期/長期をランダムに割り当てる
    const ghostDuration = Math.random() < 0.5 ? "short" : "long";
    const numGhostRounds = ghostDuration === "short"
      ? randInt(GHOST_ROUND_PARAMS.short_min, GHOST_ROUND_PARAMS.short_max)
      : randInt(GHOST_ROUND_PARAMS.long_min, GHOST_ROUND_PARAMS.long_max);
    const ghostDurationLabel = ghostDuration === "short"
      ? `短期（${GHOST_ROUND_PARAMS.short_min}〜${GHOST_ROUND_PARAMS.short_max}回）`
      : `長期（${GHOST_ROUND_PARAMS.long_min}〜${GHOST_ROUND_PARAMS.long_max}回）`;

    const ghostTimeline = [];

    // イントロ（このゴーストラウンド全体で1回だけ表示）
    ghostTimeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="center mid">
          <div style="font-size:56px;">${ghostIcon}</div>
          <p><strong>インバースラウンド</strong></p>
          <p>今回は相手が先に投資します。<br>あなたは相手にいくら返すかを決めてください。</p>
          <p>この相手とのやり取り回数：<strong>${ghostDurationLabel}</strong></p>

        labels: [String(PARAMS.invest_min), "", String(Math.round((PARAMS.invest_min + PARAMS.invest_max) / 2)), "", String(PARAMS.invest_max)],
        button_label: "確定",
        require_movement: true,
        trial_duration: PARAMS.invest_timeout,
        response_ends_trial: true,
        data: {
          phase: "trust_game", trial_kind: "invest",
          condition: condLabel, block_index: blockIdx + 1,
          partner_id: partnerId, round: roundNum,
          duration: block.duration, mu_type: block.mu_type
        },
        on_load: () => {
          const slider = document.querySelector("input[type='range']");
          const investP = document.getElementById("invest-preview");
          const keepP = document.getElementById("keep-preview");
          const barsEl = document.getElementById("my-bars");
          const oppBarsEl = document.getElementById("opp-bars");
          if (!slider || !investP) return;
          slider.classList.add("slider-hidden-thumb");
          investP.innerHTML = `投資額：—円 → 相手に渡ると <strong>×${PARAMS.multiplier}</strong>`;
          keepP.textContent = "手元に残す額：—円";
          const reveal = () => {
            slider.classList.remove("slider-hidden-thumb");
            const idx = parseInt(slider.value);
            const g = AMOUNTS[idx];
            const keep = PARAMS.endowment - g;
            const oppReceive = g * PARAMS.multiplier;
            investP.innerHTML = `投資額：<strong>${g}円</strong> → 相手に <strong>${oppReceive}円</strong>`;
            keepP.textContent = `手元に残す額：${keep}円`;
            barsEl.innerHTML = makeBar("手持ち", keep, PARAMS.endowment, "gold", "");
            oppBarsEl.innerHTML = makeBar("受取", oppReceive, PARAMS.endowment, "green", "");
          };
          slider.addEventListener("input", reveal);
          slider.addEventListener("pointerdown", reveal);
        },
        on_finish: (data) => {
          const timedOut = (data.response === null || data.response === undefined);
          const idx = timedOut ? Math.floor(AMOUNTS.length / 2) : parseInt(data.response);
          const g = AMOUNTS[idx];
          data.timed_out = timedOut;
          data.investment = g;
          data.keep = PARAMS.endowment - g;

          // 返報計算（ラグ付き: s は今回の投資の前の値を使う）
          const mu = getMu();
          const result = computeReturn(g, s, mu, delta_j);
          data.s_before = s;
          s = result.s_next; // 評判ストック更新（次試行で効く）
          data.s_after = result.s_next;
          data.mu = mu;
          data.delta_j = delta_j;
          data.r = result.r;
          data.eta = result.eta;
          data.return_amount = result.y;
          data.earnings = (PARAMS.endowment - g) + result.y;

          // デバッグ表示
          updateDebugInfo({
            "ブロック": `${blockIdx + 1}/8`,

            "評判 s(after)": result.s_next.toFixed(4),
            "返報率 r": result.r.toFixed(4),
            "ノイズ η": result.eta.toFixed(4),
            "返報額 y": result.y,
            "獲得": data.earnings,

      // コイン送出アニメ + 思考中（2-4秒）
      roundsTimeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: () => {
          const inv = jsPsych.data.get().filter({ trial_kind: "invest", condition: condLabel, round: roundNum }).last(1).values()[0];

            roundNum, oppIcon, oppName,

        type: jsPsychHtmlButtonResponse,
        stimulus: () => {

          const g = inv.investment;

          const earn = inv.earnings;
          const keep = PARAMS.endowment - g;

        },

          phase: "trust_game", trial_kind: "return_display",

          <div class="center">
            <div class="qwrap">
              <div class="qtitle">今の返し方に相手の好意／協力性を感じた</div>
              <div class="scale-labels"><span>全くそう思わない</span><span>非常にそう思う</span></div>

        // 多点返報期待（20円・50円・80円）
        [20, 50, 80].forEach(amt => {
          const maxReturn = PARAMS.multiplier * amt;
          roundsTimeline.push({
            type: jsPsychSurveyText,

              prompt: `次に${amt}円投資したら、いくら返すと思いますか？（0〜${maxReturn}の数字で入力）`,

            data: {

            },

              const val = parseInt(data.response.expected_return);
              data.expected_return = isNaN(val) ? null : clamp(val, 0, maxReturn);
            }
          });
        });
      }

      // ISI（1.5-3秒）
      roundsTimeline.push(makeFixationISI({
        phase: "trust_game", condition: condLabel, round: roundNum
      }));
    }

    // --- ブロック終了時質問（7項目、7段階ボタン、順序ランダマイズ） ---
    const blockEndQuestions = [
      { key: "norm", text: "この相手に私も何かを返すべきだと思う" },

    const shuffledQ = shuffle(blockEndQuestions);
    const blockEndTimeline = [];

    shuffledQ.forEach((q) => {
      blockEndTimeline.push({

        stimulus: `
        <div class="center">

    timeline.push({ timeline: [...roundsTimeline, ...blockEndTimeline] });

    // --- ゴーストラウンド挿入（3・5・7ブロック目の直後） ---
    const blockNumber = blockIdx + 1;
    if (GHOST_INSERT_AFTER[blockNumber]) {

  /* =========================================================
     実験終了時アンケート（11項目、7段階スライダー、順序ランダマイズ）
  ========================================================= */
  const finalQuestionItems = [
    { key: "recip_altruism_1", text: "今は損でも、将来自分に返ってきそうなら協力する。", subscale: "互恵依存利他" },

  const shuffledFinalQ = shuffle(finalQuestionItems);

  finalQTimeline.push(instructionPage(`

`));

      data: {

      },
      on_finish: (data) => { data.response_value = parseInt(data.response); }

  timeline.push({ timeline: finalQTimeline });

  /* =========================================================
     寄付課題（匿名/非匿名をランダム割り当て）
  ========================================================= */
  const donationAnonymous = Math.random() < 0.5; // true=匿名, false=非匿名
  const anonymityLabel = donationAnonymous ? "匿名" : "非匿名";
  const anonymityExplanation = donationAnonymous
    ? "個人の氏名は赤十字には伝わらず、研究室がまとめて「匿名」として送金します。"
    : "あなたの「氏名」と「寄付額」が寄付者リストに記載され、赤十字に報告されます。";

  const donationTimeline = [];
  donationTimeline.push({
    type: jsPsychHtmlSliderResponse,
    stimulus: `
    <div class="center">
      <h2>最終ボーナスと寄付のお願い</h2>
      <p>ゲーム終了にともない、追加で1000円があなたに与えられます。<br>
      このうち、任意の金額（10円単位）を日本赤十字社へ寄付することができます。</p>
      <p><strong>【今回の寄付の扱い】</strong> あなたの寄付は、<strong>${anonymityLabel}</strong> として扱われます。</p>
      <p>${anonymityExplanation}</p>
      <p class="small">寄付しない選択をしても不利益は一切ありません。</p>
      <div class="spacer"></div>
      <div id="donation-preview" class="amount-preview">寄付する額：—円</div>
      <div id="donation-keep" class="small">あなたが受け取る額：—円</div>
    </div>`,
    min: 0,

    step: 1,
    slider_start: 0,
    labels: ["0円", "500円", "1000円"],

    },

     実験終了

  timeline.push({

// ゴースト・練習は trial_kind が "invest" ではないため対象外
function computeBonus(allData) {
  const inv = allData.filter(t => t.trial_kind === "invest");
  const byBlock = {};
  inv.forEach(t => { (byBlock[t.block_index] ??= []).push(t); });

  let bonus = 0;
  const selected = [];
  Object.entries(byBlock).forEach(([blockIdx, rounds]) => {
    shuffle(rounds).slice(0, 2).forEach(t => {
      bonus += t.earnings;
      selected.push({ block_index: Number(blockIdx), round: t.round, earnings: t.earnings });
    });
  });
  return { bonus, selected };
}
  
async function uploadExperimentData() {
  const allData = jsPsych.data.get().values();
  const db = window.firebaseDB;
  const col = window.firebaseCollection;
  const add = window.firebaseAddDoc;
  const pid = PARTICIPANT_ID;
  const rc = ROOM_CODE;
  const { bonus, selected } = computeBonus(allData);
  window.__BONUS = bonus;   // available for the end screen if you want it
  // ── Sanitize: replace undefined with null, tag every record as trial data ──
  function sanitize(obj) {
    return Object.fromEntries(
      Object.entries({ ...obj, trial: 1 }).map(([k, v]) => [k, v === undefined ? null : v])
    );
  }

  const promises = [];

  // ── 1. Participant metadata ──────────────────────────────
  promises.push(add(col(db, "participants"), sanitize({
  participant_id: pid,
  room_code: rc,
  mail_id: MAIL_ID,
  timestamp: new Date().toISOString(),
  player_name: GAME.playerName,
  player_icon: GAME.playerIcon,
  player_total: GAME.playerTotal,
  donation_anonymity: allData.find(t => t.trial_kind === "donation_choice")?.anonymity ?? null,
  game_bonus: bonus,                                   // NEW
  selected_trials: JSON.stringify(selected),           // NEW: audit trail
})));
localStorage.removeItem("participant_mail");

  // ── 2. Investment trials ─────────────────────────────────
  // 注意：ゴーストラウンド（trial_kind: "ghost_*"）はここでは参照していないため、
  // 意図的にFirebaseへはアップロードされない。
  allData.filter(t => t.trial_kind === "invest").forEach(t => {
    promises.push(add(col(db, "invest_trials"), sanitize({
      participant_id: pid, room_code: rc,
      block_index: t.block_index, condition: t.condition,
      partner_id: t.partner_id, duration: t.duration,
      mu_type: t.mu_type, round: t.round,
      investment: t.investment, keep: t.keep,
      return_amount: t.return_amount, earnings: t.earnings,
      r: t.r, mu: t.mu, delta_j: t.delta_j,
      s_before: t.s_before, s_after: t.s_after,
      timed_out: t.timed_out ?? false, rt: t.rt,
    })));
  });

  // ── 3. Block-end questionnaire ───────────────────────────
  allData.filter(t => t.trial_kind === "block_end_q").forEach(t => {
    promises.push(add(col(db, "block_end_q"), sanitize({
      participant_id: pid, room_code: rc,
      block_index: t.block_index, condition: t.condition,
      partner_id: t.partner_id, question_key: t.question_key,
      response_value: t.response_value, rt: t.rt,
    })));
  });

  // ── 4a. Mini goodwill ────────────────────────────────────
  allData.filter(t => t.trial_kind === "mini_q_goodwill").forEach(t => {
    promises.push(add(col(db, "mini_q_goodwill"), sanitize({
      participant_id: pid, room_code: rc,
      block_index: t.block_index, condition: t.condition,
      partner_id: t.partner_id, round: t.round,
      response_value: t.response_value, rt: t.rt,
    })));
  });

  // ── 4b. Mini expectancy ──────────────────────────────────
  allData.filter(t => t.trial_kind === "mini_q_expectancy").forEach(t => {
    promises.push(add(col(db, "mini_q_expectancy"), sanitize({
      participant_id: pid, room_code: rc,
      block_index: t.block_index, condition: t.condition,
      partner_id: t.partner_id, round: t.round,
      probe_amount: t.probe_amount,
      expected_return: t.expected_return, rt: t.rt,
    })));
  });

  // ── 5. Final questionnaire ───────────────────────────────
  allData.filter(t => t.trial_kind === "final_q").forEach(t => {
    promises.push(add(col(db, "final_questionnaire"), sanitize({
      participant_id: pid, room_code: rc,
      question_key: t.question_key, subscale: t.subscale,
      response_value: t.response_value, rt: t.rt,
    })));
  });

  // ── 6. Donation ──────────────────────────────────────────
  const donation = allData.find(t => t.trial_kind === "donation_choice");
  if (donation) {
    promises.push(add(col(db, "donations"), sanitize({
      participant_id: pid, room_code: rc,
      anonymity: donation.anonymity,
      donation_amount: donation.donation_amount,
      donation_keep: donation.donation_keep,
      rt: donation.rt,
    })));
  }

  const results = await Promise.allSettled(promises);
  const failed = results.filter(r => r.status === "rejected");
  if (failed.length > 0) {
    console.error(`${failed.length} uploads failed:`, failed.map(f => f.reason));
    alert(`Warning: ${failed.length} records failed to upload. Check console.`);
  } else {
    console.log(`All ${results.length} records uploaded successfully.`);
  }
}

  function startExperiment() {
    jsPsych = initJsPsych({
  display_element: "jspsych-target",
  on_finish: async () => {
    document.getElementById("jspsych-target").innerHTML =
      `<div style="text-align:center;font-size:20px;font-family:sans-serif;">
        <p>データを保存しています...</p>
        <div class="spinner" style="margin:20px auto;"></div>
      </div>`;

    try {
      await uploadExperimentData();
    } catch (err) {
      console.error("Upload error:", err);
      alert("Upload failed: " + err.message);
    }

    // CSV書き出し：ゴーストラウンド（phase === "ghost_round"）はここでも除外する
    const csvData = jsPsych.data.get().filterCustom((t) => t.phase !== "ghost_round");
    const csv = csvData.csv();
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.click();

    // NEW: signal React that the experiment is done
    window.parent.postMessage(
      {
        type: "EXPERIMENT_COMPLETE",
        participantId: PARTICIPANT_ID
      },
      "*"
    );
  }
  
});

    jsPsych.run(timeline);
  }
